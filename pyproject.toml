[project]
name = "rag-lab"
version = "0.1.0"
description = "Local RAG lab: PDF+text ingest, hybrid retrieval, rerank, cited generation (infra+skeleton v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "azure-storage-blob>=12.20",
    "openai>=1.40",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "azure-core>=1.41.0",
    "fastapi-cli>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
    "deptry>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "RUF", "A", "G", "PTH", "RET", "C90", "PT", "FBT", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[tool.fastapi]
entrypoint = "rag_lab.api.main:app"

[tool.deptry.per_rule_ignores]
# Used without being imported: uvicorn/fastapi-cli run the server via CLI,
# python-multipart is exercised implicitly by Starlette form/file parsing.
DEP002 = ["uvicorn", "fastapi-cli", "python-multipart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--cov=rag_lab", "--cov-report=term-missing", "--cov-fail-under=80"]
