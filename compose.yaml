name: rag-lab

services:
  db:
    image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    container_name: rag-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: raglab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:f9791d0a0613e93057c06ae31f7ac0c0222f0530590e67e020b0986c66a36fa6
    container_name: rag-lab-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # shortcut: tag without digest pin; pin via `podman pull` digest once the
  # worker loop proves stable (ADR-0006 bump process).
  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: rag-lab-worker
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    network_mode: host
    # Single source of truth is the repo .env (LLM on :8080, embeddings on
    # :8081 via host llama-server; localhost works because of host networking).
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    command: ["uv", "run", "--no-dev", "python", "-m", "rag_lab.worker.run"]

  api:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: rag-lab-api
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    # Host networking so OPENAI_/EMBEDDING_BASE_URL=localhost reaches the
    # host llama-server processes (same reason as worker above).
    network_mode: host
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    command: ["uv", "run", "--no-dev", "fastapi", "run", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
  azurite-data:
