name: rag-lab

services:
  db:
    image: pgvector/pgvector:pg16@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    container_name: rag-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: raglab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:f9791d0a0613e93057c06ae31f7ac0c0222f0530590e67e020b0986c66a36fa6
    container_name: rag-lab-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  # shortcut: tag without digest pin; pin via `podman pull` digest once the
  # worker loop proves stable (ADR-0006 bump process).
  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: rag-lab-worker
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    network_mode: host
    environment:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/raglab
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
      BLOB_CONTAINER: kb-raw
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    command: ["uv", "run", "--no-dev", "python", "-m", "rag_lab.worker.run"]

volumes:
  pgdata:
  azurite-data:
